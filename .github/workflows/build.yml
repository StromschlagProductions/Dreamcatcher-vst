name: Windows-VST3 bauen

# Sparsamer Betrieb (GitHub-Actions-Kontingent):
# - Kein automatischer Lauf mehr bei jedem Push. Entwickelt und getestet wird lokal (Bau, DSP-Tests, pluginval).
# - Der vollstaendige Windows-Bau mit pluginval (Strictness 8) laeuft nur auf Anforderung:
#   GitHub -> Actions -> "Windows-VST3 bauen" -> "Run workflow". Er ist die abschliessende Abnahme.
# - Ein Release entsteht nur, wenn beim Start "release" angehakt wird (Standard: aus). Nichts wird automatisch veroeffentlicht.
# - Ueberholte Laeufe auf demselben Zweig werden abgebrochen, ein haengender Lauf endet nach 20 Minuten.
# Beschreibung: .github/CI.md

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Nach bestandener Pruefung ein Release mit ZIP erstellen (Download-Link in der README)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Version lesen
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -TotalCount 1).Trim()
          "DCH_VERSION=$v" >> $env:GITHUB_ENV

      - name: Konfigurieren
        run: cmake -B build -A x64

      - name: Bauen
        run: cmake --build build --config Release --parallel

      - name: Regressionstests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Plugin bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Dreamcatcher-VST3-Windows
          path: build/Dreamcatcher_artefacts/Release/VST3
          if-no-files-found: error
          retention-days: 14

      - name: Stabilitaetstest (pluginval)
        shell: pwsh
        run: |
          curl.exe -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 8 --validate-in-process --validate "build/Dreamcatcher_artefacts/Release/VST3/Dreamcatcher.vst3"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: ZIP packen
        if: ${{ inputs.release }}
        shell: pwsh
        run: Compress-Archive -Path "build/Dreamcatcher_artefacts/Release/VST3/Dreamcatcher.vst3" -DestinationPath "Dreamcatcher-VST3-Windows.zip"

      - name: Release mit ZIP erstellen
        if: ${{ inputs.release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.DCH_VERSION }}-b${{ github.run_number }}
          name: Dreamcatcher v${{ env.DCH_VERSION }}
          make_latest: true
          files: |
            Dreamcatcher-VST3-Windows.zip
          body_path: docs/RELEASE_NOTES.md
